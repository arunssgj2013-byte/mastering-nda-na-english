name: Apply Homepage Hero Photos V74
on:
  push:
    paths:
      - '.github/workflows/apply-home-hero-photos-v74.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode photos and update homepage slider
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          h1 = ''.join(Path(f'.github/tmp/v74-h1-{i:02d}.b64').read_text().strip() for i in range(2))
          h2 = ''.join(Path(f'.github/tmp/v74-h2-{i:02d}.b64').read_text().strip() for i in range(5))

          Path('assets/images').mkdir(parents=True, exist_ok=True)
          Path('assets/images/hero-officer-march.webp').write_bytes(base64.b64decode(h1))
          Path('assets/images/hero-women-cadets.webp').write_bytes(base64.b64decode(h2))

          p = Path('index.html')
          s = p.read_text()

          slides = (
            '<div class="hero-slide"><img src="assets/images/hero-officer-march.webp" alt="Cadet in ceremonial white uniform marching with sword"><div class="hero-slide-overlay"><span class="slide-tag">Officer-like Bearing</span><h3>Precision in every step. Confidence in every command.</h3><p>Let disciplined preparation shape the clarity, composure and confidence needed to aim for the Academy.</p></div></div>'
            '<div class="hero-slide"><img src="assets/images/hero-women-cadets.webp" alt="Women cadets marching down academy steps"><div class="hero-slide-overlay"><span class="slide-tag">Future Leaders</span><h3>Dream boldly. Train diligently. Lead with confidence.</h3><p>Focused preparation today builds the knowledge, discipline and self-belief behind tomorrow’s uniform.</p></div></div>'
          )

          if 'hero-officer-march.webp' not in s:
              anchor = '<div class="hero-slider-topline">'
              if anchor not in s:
                  raise SystemExit('hero slider anchor not found')
              s = s.replace(anchor, slides + anchor, 1)

          if 'data-slide-to="3"' not in s:
              dot = '<button type="button" data-slide-to="2" aria-label="Slide 3"></button>'
              repl = dot + '<button type="button" data-slide-to="3" aria-label="Slide 4"></button><button type="button" data-slide-to="4" aria-label="Slide 5"></button>'
              if dot not in s:
                  raise SystemExit('slider dot anchor not found')
              s = s.replace(dot, repl, 1)

          p.write_text(s)
          PY
      - name: Commit homepage hero photos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/tmp/hero1-00.b64
          rm -f .github/tmp/v74-h1-*.b64 .github/tmp/v74-h2-*.b64
          rm -f .github/workflows/apply-home-hero-photos-v74.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add two new homepage hero slides"
          git push
