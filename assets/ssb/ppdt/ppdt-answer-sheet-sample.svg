<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc">
<title id="title">Fictional PPDT answer sheet example</title>
<desc id="desc">A sample paper showing character count, approximate age, sex, mood, a circled first-noticed character, action, setting, and a brief fictional story about a school sports meet. It is not based on any practice picture.</desc>
<rect width="720" height="1000" rx="20" fill="#edf2f7"/>
<rect x="22" y="18" width="676" height="964" rx="18" fill="#fffefb" stroke="#cbd7e3" stroke-width="3"/>
<rect x="22" y="18" width="676" height="130" rx="18" fill="#173b63"/>
<path d="M22 128h676v20H22z" fill="#173b63"/>
<text x="56" y="60" fill="#b9d4ed" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="2">PPDT ANSWER SHEET</text>
<text x="56" y="108" fill="#ffffff" font-family="Arial,sans-serif" font-size="34" font-weight="700">Sample format</text>
<rect x="468" y="42" width="190" height="40" rx="20" fill="#f4be4f"/>
<text x="563" y="69" text-anchor="middle" fill="#3b321d" font-family="Arial,sans-serif" font-size="17" font-weight="700">SAMPLE ONLY</text>
<text x="56" y="185" fill="#39536d" font-family="Arial,sans-serif" font-size="19" font-weight="700">MOCK EXAMPLE · FICTIONAL SCHOOL SPORTS MEET</text>
<rect x="48" y="207" width="624" height="57" rx="12" fill="#fff5de" stroke="#f0d59a" stroke-width="2"/>
<text x="70" y="243" fill="#604b21" font-family="Arial,sans-serif" font-size="22"><tspan font-weight="700">Characters perceived:</tspan><tspan> 3</tspan></text>
<text x="56" y="304" fill="#1b456e" font-family="Arial,sans-serif" font-size="20" font-weight="700">CHARACTER DETAILS</text>
<rect x="48" y="320" width="624" height="52" rx="8" fill="#e8eff8"/>
<text x="79" y="353" fill="#23486d" font-family="Arial,sans-serif" font-size="18" font-weight="700">No.</text>
<text x="172" y="353" fill="#23486d" font-family="Arial,sans-serif" font-size="18" font-weight="700">Approx. age</text>
<text x="355" y="353" fill="#23486d" font-family="Arial,sans-serif" font-size="18" font-weight="700">Sex*</text>
<text x="494" y="353" fill="#23486d" font-family="Arial,sans-serif" font-size="18" font-weight="700">Mood*</text>
<g font-family="Arial,sans-serif" font-size="21" fill="#253c52">
<rect x="48" y="374" width="624" height="65" fill="#fff" stroke="#d8e2ec" stroke-width="1"/>
<text x="83" y="416" font-weight="700">1</text><text x="180" y="416">19 yrs</text><text x="368" y="416">F</text><text x="510" y="416" fill="#18734f" font-weight="700">+ Positive</text>
<ellipse cx="84" cy="406" rx="29" ry="27" fill="none" stroke="#d94a4a" stroke-width="4" transform="rotate(-9 84 406)"/>
<rect x="48" y="439" width="624" height="61" fill="#f8fafc" stroke="#d8e2ec" stroke-width="1"/>
<text x="83" y="478" font-weight="700">2</text><text x="180" y="478">20 yrs</text><text x="368" y="478">M</text><text x="510" y="478" fill="#637487">0 Neutral</text>
<rect x="48" y="500" width="624" height="61" fill="#fff" stroke="#d8e2ec" stroke-width="1"/>
<text x="83" y="539" font-weight="700">3</text><text x="180" y="539">42 yrs</text><text x="368" y="539">M</text><text x="510" y="539" fill="#18734f">+ Positive</text>
</g>
<text x="57" y="591" fill="#627489" font-family="Arial,sans-serif" font-size="16">*Use the symbols or categories instructed by your board.</text>
<rect x="48" y="616" width="624" height="73" rx="10" fill="#eaf5f1" stroke="#c8e5d7" stroke-width="2"/>
<text x="68" y="646" fill="#176148" font-family="Arial,sans-serif" font-size="18" font-weight="700">ACTION / TITLE</text>
<text x="68" y="674" fill="#294d42" font-family="Arial,sans-serif" font-size="20">Volunteers organise a school sports meet.</text>
<rect x="48" y="702" width="624" height="57" rx="10" fill="#eef3fb" stroke="#d3deed" stroke-width="2"/>
<text x="68" y="738" fill="#1b4b78" font-family="Arial,sans-serif" font-size="18" font-weight="700">SETTING</text>
<text x="172" y="738" fill="#344e67" font-family="Arial,sans-serif" font-size="20">School athletics ground</text>
<text x="56" y="799" fill="#1b456e" font-family="Arial,sans-serif" font-size="20" font-weight="700">SHORT STORY · FICTIONAL FORMAT EXAMPLE</text>
<rect x="48" y="815" width="624" height="118" rx="10" fill="#fff" stroke="#d8e2ec" stroke-width="2"/>
<text x="68" y="849" fill="#344e67" font-family="Arial,sans-serif" font-size="18"><tspan x="68" dy="0">Ananya notices that the school sports meet is about to begin</tspan><tspan x="68" dy="25">while equipment is still scattered. She coordinates two volunteers,</tspan><tspan x="68" dy="25">organises the equipment and checks the track with the teacher.</tspan><tspan x="68" dy="25">The events start on time, and the team completes the meet smoothly.</tspan></text>
<rect x="48" y="948" width="624" height="20" rx="10" fill="#fce9e6"/>
<text x="360" y="963" text-anchor="middle" fill="#9b3730" font-family="Arial,sans-serif" font-size="15" font-weight="700">Do not copy these details or story for your practice picture.</text>
</svg>
