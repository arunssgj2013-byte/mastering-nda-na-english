<path d="M352 202a12 12 0 0 1 12-12h302a12 12 0 0 1 12 12v41H352z" fill="#eaf1f8"/><text x="372" y="222" fill="#1e4d78" font-family="Arial,sans-serif" font-size="18" font-weight="700">ACTION</text>
<text x="372" y="270" fill="#6a7f93" font-family="Arial,sans-serif" font-size="14">Write a brief title or one-line summary.</text>
