<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1000" viewBox="0 0 720 1000" role="img" aria-labelledby="title desc">
<title id="title">Blank PP&amp;DT answer sheet preview</title>
<desc id="desc">A blank PP&amp;DT sheet based on the attached layout. Candidate details appear at the top, character perception on the left, action on the right, and lined story-writing space below.</desc>
<rect width="720" height="1000" rx="18" fill="#eef2f7"/><rect x="20" y="16" width="680" height="968" rx="16" fill="#fff" stroke="#cbd5e0" stroke-width="3"/>
<text x="360" y="58" text-anchor="middle" fill="#173b63" font-family="Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="1">PP&amp;DT</text><line x1="82" y1="77" x2="638" y2="77" stroke="#173b63" stroke-width="3"/>
<g font-family="Arial,sans-serif" font-size="17" fill="#2e4053" font-weight="700">
<text x="46" y="116">No. of SSB</text><line x1="143" y1="120" x2="253" y2="120" stroke="#8c9cab" stroke-width="1.5"/>
<text x="280" y="116">Batch No.</text><line x1="370" y1="120" x2="472" y2="120" stroke="#8c9cab" stroke-width="1.5"/>
<text x="507" y="116">Chest No.</text><line x1="597" y1="120" x2="671" y2="120" stroke="#8c9cab" stroke-width="1.5"/>
<text x="46" y="159">Name</text><line x1="102" y1="163" x2="293" y2="163" stroke="#8c9cab" stroke-width="1.5"/>
<text x="316" y="159">Age</text><line x1="357" y1="163" x2="435" y2="163" stroke="#8c9cab" stroke-width="1.5"/>
<text x="467" y="159">Date</text><line x1="516" y1="163" x2="671" y2="163" stroke="#8c9cab" stroke-width="1.5"/>
</g>
<rect x="42" y="190" width="294" height="370" rx="12" fill="#fbfdff" stroke="#9caebe" stroke-width="2"/>
<path d="M42 202a12 12 0 0 1 12-12h270a12 12 0 0 1 12 12v41H42z" fill="#eaf1f8"/>
<text x="60" y="220" fill="#1e4d78" font-family="Arial,sans-serif" font-size="17" font-weight="700">CHARACTER PERCEPTION</text>
<text x="60" y="237" fill="#596f84" font-family="Arial,sans-serif" font-size="12">Circle the first character you noticed</text>
<text x="58" y="272" fill="#405a72" font-family="Arial,sans-serif" font-size="13" font-weight="700">NO.</text><text x="106" y="272" fill="#405a72" font-family="Arial,sans-serif" font-size="13" font-weight="700">AGE</text><text x="176" y="272" fill="#405a72" font-family="Arial,sans-serif" font-size="13" font-weight="700">SEX</text><text x="238" y="272" fill="#405a72" font-family="Arial,sans-serif" font-size="13" font-weight="700">MOOD</text>
